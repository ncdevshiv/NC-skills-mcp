[package]
name = "skills-mcp-server"
version = "2.1.0"
edition = "2021"
description = "MCP 2025-11-25 compliant skills server — 928 skills with pagination, security gates, hierarchical tree taxonomy, and agent-overload protection (Rust port)"
authors = ["ncdevshiv"]
readme = "README.md"
repository = "https://github.com/ncdevshiv/NC-skills-mcp"
license = "MIT"
keywords = ["mcp", "skills", "ai", "agent"]
categories = ["development-tools"]

[[bin]]
name = "skills-mcp-server"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
base64 = "0.22"
regex = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "2"
axum = { version = "0.7", features = ["json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
futures = "0.3"
moka = { version = "0.12", features = ["sync"] }
lru = "0.12"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
chrono = "0.4"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
