[project]
name = "skills-mcp-server"
version = "2.0.0"
description = "MCP 2025-11-25 compliant skills server — 928 skills with pagination, security gates, and agent-overload protection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio"]

[project.scripts]
skills-mcp = "skills_mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
